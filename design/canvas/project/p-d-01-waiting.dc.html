<style>
body{margin:0}
strong{font-weight:500}
a{color:#111}a:hover{color:#FF7A00}
.cp{font-family:Inter,system-ui,sans-serif;color:#111;background:#fff}
.cp *{box-sizing:border-box}
.un{font-family:Unbounded,Inter,sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 28px;border-radius:12px;font-weight:500;font-size:17px;text-decoration:none}
.bk{background:#FFD84D;color:#111;border:2px solid #111}

.frame{border:1px solid #DADADA;border-radius:24px;overflow:hidden;background:#fff}
.ph{overflow:hidden;border-radius:24px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}

.mut{color:#4A4A4A}

.fl{display:flex;align-items:center;min-height:44px;text-decoration:none}
.cp svg{flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;font-size:14px;font-weight:500}
.nm{background:#FFD84D;padding:0 8px;border-radius:4px}
.tn{font-variant-numeric:tabular-nums}
.ob{border:2px solid #111;color:#111;background:#fff}

  </div>
  <a class="btn ob" href="#" style="gap:10px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Add to calendar</a>
