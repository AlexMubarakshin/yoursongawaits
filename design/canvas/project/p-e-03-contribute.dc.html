<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Group gift, add your part</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
strong{font-weight:500}
a{color:#111}a:hover{color:#FF7A00}
.cp{font-family:Inter,system-ui,sans-serif;color:#111;background:#fff}
.cp *{box-sizing:border-box}
.un{font-family:Unbounded,Inter,sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 28px;border-radius:12px;font-weight:500;font-size:17px;text-decoration:none;border:none;font-family:Inter,system-ui,sans-serif;cursor:pointer}
.bk{background:#111;color:#fff}
.bo{background:#fff;color:#111;border:2px solid #111}
.sm{height:44px;padding:0 16px;font-size:15px}
.tile{border-radius:28px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.frame{border:1px solid #DADADA;border-radius:24px;overflow:hidden;background:#fff}
.ph{overflow:hidden;border-radius:24px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.play{width:48px;height:48px;border-radius:50%;background:#111;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.mut{color:#4A4A4A}
.tn{font-variant-numeric:tabular-nums}
.h2{margin:0;font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1.05}
.lb{font-size:15px;font-weight:500;display:block;margin-bottom:8px}
.in{width:100%;height:52px;border:2px solid #111;border-radius:12px;padding:0 16px;font:400 16px Inter,system-ui,sans-serif;color:#111;background:#fff}
.ta{width:100%;border:2px solid #111;border-radius:12px;padding:14px 16px;font:400 16px/1.5 Inter,system-ui,sans-serif;color:#111;background:#fff;resize:none;display:block}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;font-size:13px;font-weight:500;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #DADADA}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid #DADADA;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.fl{display:flex;align-items:center;min-height:44px;text-decoration:none}
</style>
</helmet>
<div class="cp" style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative">
<header style="display:flex;align-items:center;justify-content:center;height:76px;padding:0 20px"><a href="#" style="font-family:Unbounded,Inter,sans-serif;font-weight:500;font-size:18px;color:#111;display:flex;align-items:center;min-height:44px;text-decoration:none">openyoursong</a></header>
<form style="padding:4px 20px 0;display:flex;flex-direction:column;gap:20px" action="#">
<div><label class="lb" for="sig">How should we sign you</label><input id="sig" class="in" value="Kate" required></div>
<div><label class="lb" for="mem">A memory for the song</label><textarea id="mem" class="ta" rows="4">The night Anna biked to the airport with a cake in the basket because I’d missed my flight home</textarea><span class="mut tn" style="font-size:13px;display:block;margin-top:6px;text-align:right">104 / 500</span></div>
<div><label class="lb" for="note">A note Anna reads after the song</label><textarea id="note" class="ta" rows="2">Thirty looks good on you. Still owe you a cake</textarea><span class="mut tn" style="font-size:13px;display:block;margin-top:6px;text-align:right">46 / 200</span></div>
<div><span class="lb">A photo of you two</span><label for="ph" style="display:flex;align-items:center;gap:12px;height:56px;border:1px dashed #111;border-radius:12px;padding:0 16px;font-size:15px;cursor:pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v12H4zM12 10a3 3 0 100 6 3 3 0 100-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Add a photo<span class="mut" style="margin-left:auto;font-size:13px">optional</span></label><input id="ph" type="file" accept="image/*" style="position:absolute;left:-9999px"><span class="mut" style="display:block;margin-top:6px;font-size:13px;line-height:1.4">It plays in the slideshow while Anna hears her song. Old photos make people cry the most</span></div>
<div><label class="lb" for="em">Email <span class="mut" style="font-weight:400">optional</span></label><input id="em" class="in" type="email" placeholder="kate@example.com"><span class="mut" style="font-size:13px;line-height:1.45;display:block;margin-top:6px">Only for this gift: when Anna opens it and if she sends a reaction</span></div>
</form>
<div style="position:absolute;left:0;right:0;bottom:0;padding:16px 20px 24px;background:#fff;border-top:1px solid #DADADA"><button class="btn bk" type="submit" style="width:100%">Send my part</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
