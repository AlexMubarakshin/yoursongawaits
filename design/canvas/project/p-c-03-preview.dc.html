<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview and takes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
strong{font-weight:500}
a{color:#111}a:hover{color:#FF7A00}
.cp{font-family:Inter,system-ui,sans-serif;color:#111;background:#fff}
.cp *{box-sizing:border-box}
.un{font-family:Unbounded,Inter,sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 28px;border-radius:12px;font-weight:500;font-size:17px;text-decoration:none}
.bk{background:#FFD84D;color:#111;border:2px solid #111}
.bk:hover{background:#FFE27A;color:#111}
.bi{background:#111;color:#fff;border:2px solid #111}
.bi:hover{background:#333;color:#fff}
.bw{background:#fff;color:#111}
.tile{border-radius:28px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.frame{border:1px solid #DADADA;border-radius:24px;overflow:hidden;background:#fff}
.ph{overflow:hidden;border-radius:24px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.play{width:48px;height:48px;border-radius:50%;background:#111;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.mut{color:#4A4A4A}
.h2{margin:0;font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1.05}
details{border-top:1px solid #DADADA;padding:24px 0}
summary{cursor:pointer;min-height:44px;font-size:18px;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
details p{margin:12px 0 0;font-size:16px;line-height:1.6;color:#4A4A4A}
.fl{display:flex;align-items:center;min-height:44px;text-decoration:none}
.inp{width:100%;height:52px;border:2px solid #111;border-radius:12px;padding:0 16px;font:500 17px Inter,system-ui,sans-serif;color:#111;background:#fff}
.lbl{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.bo{border:2px solid #111;background:#fff;color:#111}
button.btn{cursor:pointer;font-family:inherit;border:none}
button.bo{border:2px solid #111}
.tn{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.back{width:44px;height:44px;border-radius:12px;border:1px solid #DADADA;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#111}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #DADADA}
.ck{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.4}
</style>
</helmet>
<div class="cp" style="width:390px;height:844px;box-sizing:border-box;overflow:hidden">
<header style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px"><button aria-label="Back" style="width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:flex-start;cursor:pointer;padding:0;color:#111"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><a href="#" style="font-family:Unbounded,Inter,sans-serif;font-weight:500;font-size:18px;color:#111;display:flex;align-items:center;min-height:44px;text-decoration:none">openyoursong</a><span style="width:44px"></span></header>
<section style="padding:8px 20px 0;display:flex;flex-direction:column;gap:20px">
  <h1 class="un" style="margin:0;font-size:32px;line-height:1.05;font-weight:500;letter-spacing:-.02em">Your free preview</h1>
  <div class="tile" style="background:#F2F2F2;padding:24px;gap:20px">
    <p class="un" style="margin:0;font-size:24px;font-weight:500;line-height:1.25;letter-spacing:-.02em"><span style="background:#FFD84D;padding:0 8px;border-radius:4px">Anna</span>, you still ride that yellow bike</p>
    <div style="display:flex;align-items:center;gap:16px"><button class="play" aria-label="Pause preview"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20"><path d="M7 4v12M13 4v12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"></path></svg></button>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:6px;border-radius:3px;background:#DADADA"><div style="width:38%;height:100%;border-radius:3px;background:#111"></div></div><div class="tn mut" style="display:flex;justify-content:space-between;font-size:13px"><span>0:15</span><span>0:40</span></div></div></div>
    <span class="mut" style="font-size:14px;line-height:1.5">The start of the full song, fades out. Full quality after you pay</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:#FFD84D;border:2px solid #111"><button class="play" aria-label="Play take 1" style="width:44px;height:44px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20"><path d="M6 4l10 6-10 6z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"></path></svg></button><div style="display:flex;flex-direction:column;gap:4px;flex:1"><strong style="font-size:16px">Take 1</strong><span class="mut" style="font-size:14px">Pop, bright</span></div><span class="tn" style="font-size:14px">0:40</span></div><div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:#fff;border:1px solid #DADADA"><button class="play" aria-label="Play take 2" style="width:44px;height:44px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20"><path d="M6 4l10 6-10 6z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"></path></svg></button><div style="display:flex;flex-direction:column;gap:4px;flex:1"><strong style="font-size:16px">Take 2</strong><span class="mut" style="font-size:14px">Pop, slower</span></div><span class="tn" style="font-size:14px">0:40</span></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center"><a href="#" class="fl" style="font-size:15px;font-weight:500">Name sounds off?</a><a href="#" class="fl" style="font-size:15px;font-weight:500">Edit lyrics, try again</a></div>
  <button class="btn bk" style="width:100%">Continue with take 1</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
